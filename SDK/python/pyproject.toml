[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nanalive-sdk"
version = "0.1.0"
description = "NanaLive 插件 API 的 Python 客户端绑定"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "websockets>=12",
    "msgpack>=1.0",
]

[project.optional-dependencies]
# 备选传输后端：安装后即可 NanaLiveSession(transport="aiohttp")。
aiohttp = [
    "aiohttp>=3.10",
]
all = [
    "nanalive-sdk[aiohttp]",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiohttp>=3.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nanalive_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
