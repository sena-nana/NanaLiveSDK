name: Plugin registry from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  create-registry-pr:
    if: contains(join(github.event.issue.labels.*.name, ','), 'Publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update registry
        id: registry
        run: node .github/scripts/update-plugin-registry.mjs

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "registry: add plugin ${{ steps.registry.outputs.name }}"
          title: "Plugin: ${{ steps.registry.outputs.name }}"
          body: |
            由 #${{ github.event.issue.number }} 自动创建。

            - 插件：`${{ steps.registry.outputs.name }}`
            - 仓库：${{ steps.registry.outputs.repo }}
          branch: registry/issue-${{ github.event.issue.number }}
          delete-branch: true
